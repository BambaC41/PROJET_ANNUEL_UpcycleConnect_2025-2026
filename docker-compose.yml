version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: upcycle-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/v1.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - upcycle-net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upcycle-web
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./uploads:/var/www/html/uploads
      - ./storage:/var/www/html/storage
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - API_BASE_URL=http://api:8080
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db
      - api
    networks:
      - upcycle-net

  api:
    build:
      context: ./api/api
      dockerfile: Dockerfile
    container_name: upcycle-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET}
      - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    depends_on:
      - db
    networks:
      - upcycle-net

networks:
  upcycle-net:
    driver: bridge

volumes:
  db_data: